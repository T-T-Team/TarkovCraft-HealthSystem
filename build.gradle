plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version "${moddev_version}"
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${project.mod_version}+${project.minecraft_version}"
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        name 'Toma'
        url 'https://repo.repsy.io/mvn/toma/public/'
    }
    maven {
        name 'Toma development'
        url 'https://repo.repsy.io/mvn/toma/development/'
        credentials {
            username project.findProperty("MAVEN_USERNAME").toString() ?: ""
            password project.findProperty("MAVEN_PASSWORD").toString() ?: ""
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

java {
    withSourcesJar()

    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    accessTransformers = project.files('src/main/templates/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

def integration = { dependencyHandler, runtime, notation ->
    dependencyHandler.add(runtime.toString().toBoolean() ? "implementation" : "compileOnly", notation)
}

dependencies {
    // Configuration
    implementation "dev.toma.configuration:configuration-${project.minecraft_version}:${project.configuration}-neoforge"
    // Core library
    implementation "tnt.tarkovcraft:tarkovcraft_core:${project.core}"

    // Integrations/Compatibility ----

    // Carry on
    integration(delegate, project.carryon_runtime, "maven.modrinth:carry-on:${project.carryon}")

    // Sable integration
    integration(delegate, project.sable_runtime, "maven.modrinth:sable:${project.sable}")
    integration(delegate, project.sable_runtime, "maven.modrinth:sable-ragdolls:${project.sable_ragdolls}")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            configuration          : configuration,
            configuration_range    : configuration_range,
            core                   : core,
            core_range             : core_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Jar).configureEach {
    archiveBaseName = "${mod_id}-neoforge"
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = "${mod_group_id}"
            artifactId = "${project.mod_id}"
            version ="${project.version}"

            artifact jar
            artifact sourcesJar
        }
    }

    repositories {
        String mavenType = isDevelopmentVersion() ? "MAVEN_PRIVATE_URL" : "MAVEN_PUBLIC_URL"
        maven {
            url = uri(project.findProperty(mavenType).toString() ?: "")
            credentials {
                username project.findProperty("MAVEN_USERNAME").toString() ?: ""
                password project.findProperty("MAVEN_PASSWORD").toString() ?: ""
            }
        }
    }
}

def isDevelopmentVersion() {
    def versionString = version.toString()
    return versionString.contains("dev")
}