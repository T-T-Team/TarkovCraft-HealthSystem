name: Release
on:
  push:
    tags:
      - 'version/*'

env:
  JAVA_VENDOR: 'microsoft'
  JAVA_VERSION: '25'
  GAME_VERSION: '26.2'
  GAME_DEPENDENCIES: 'configuration,tarkovcraft-core'
  CURSEFORGE_PROJECT: '1268501'
  MODRINTH_PROJECT: 'sodxIUKj'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_VENDOR }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - run: ./gradlew assemble --no-configuration-cache
      - uses: actions/upload-artifact@v7
        with:
          name: artifact-neoforge
          path: build/libs/*-neoforge-*.jar
          retention-days: 1
          if-no-files-found: error

  prepare-changelog:
    runs-on: ubuntu-latest
    needs: build
    outputs:
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - uses: actions/checkout@v7
      - uses: Toma1O6/file-read-action@v1
        id: changelog
        with:
          file: 'CHANGELOG.md'
          max-chars: '4096'

  publish-curseforge:
    runs-on: ubuntu-latest
    needs:
      - prepare-changelog
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: artifact-neoforge
          path: 'artifacts'
      - uses: T-T-Team/curseforge-publish-action@v1
        with:
          artifact-directory: 'artifacts'
          token: ${{ secrets.CF_TOKEN }}
          project-id: ${{ env.CURSEFORGE_PROJECT }}
          game-version: ${{ env.GAME_VERSION }}
          mod-loader: 'NeoForge'
          java-version: Java ${{ env.JAVA_VERSION }}
          changelog-content: ${{ needs.prepare-changelog.outputs.changelog }}
          required-dependencies: ${{ env.GAME_DEPENDENCIES }}
          debug-mode: ${{ vars.DEBUG }}

  publish-modrinth:
    runs-on: ubuntu-latest
    needs:
      - prepare-changelog
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: artifact-neoforge
          path: 'artifacts'
      - uses: T-T-Team/modrinth-publish-action@v1
        with:
          artifact-directory: 'artifacts'
          token: ${{ secrets.MODRINTH_TOKEN }}
          project-id: ${{ env.MODRINTH_PROJECT }}
          game-version: ${{ env.GAME_VERSION }}
          mod-loader: 'NeoForge'
          changelog-content: ${{ needs.prepare-changelog.outputs.changelog }}
          required-dependencies: ${{ env.GAME_DEPENDENCIES }}
          debug-mode: ${{ vars.DEBUG }}

  announce-release-discord:
    runs-on: ubuntu-latest
    needs:
      - prepare-changelog
      - publish-curseforge
      - publish-modrinth
    steps:
      - uses: T-T-Team/discord-release-announcement-action@v2
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          message: <@&${{ vars.PUBLISH_ROLE_TAG }}>
          title: 'Medical System'
          homepage: ${{ vars.PUBLISH_SOURCES_URL }}
          changelog: ${{ needs.prepare-changelog.outputs.changelog }}
          color: '5434377'
          icon-url: ${{ vars.PUBLISH_ICON }}
          note: 'CurseForge file may take up to 1 hour to be published'
          curseforge-url: ${{ vars.PUBLISH_CF_LINK }}
          modrinth-url: ${{ vars.PUBLISH_MODRINTH_LINK }}
          sources-url: ${{ vars.PUBLISH_SOURCES_URL }}
          issue-tracker-url: ${{ vars.PUBLISH_SOURCES_URL }}/issues
          wiki-url: ${{ vars.PUBLISH_WIKI_URL }}/wiki
          donation-url: ${{ vars.PUBLISH_DONATE_LINK }}
          debug-mode: ${{ vars.DEBUG }}